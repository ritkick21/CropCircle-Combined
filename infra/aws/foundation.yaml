AWSTemplateFormatVersion: '2010-09-09'
Description: CropCircle staging or production infrastructure in an existing VPC
Parameters:
  Environment:
    Type: String
    AllowedValues: [staging, production]
  Vpc:
    Type: AWS::EC2::VPC::Id
  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two public subnets in distinct availability zones
  PrivateSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two private subnets in distinct availability zones with outbound access
  Domain:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9.-]*[a-z0-9]'
  CertificateArn:
    Type: String
  ApplicationSecretArn:
    Type: String
    Description: Existing Secrets Manager JSON secret populated after infrastructure creation
  DbClass:
    Type: String
    Default: db.t4g.micro
  DbVersion:
    Type: String
    Default: '17.11'
  CacheClass:
    Type: String
    Default: cache.t4g.micro
  AlertEmail:
    Type: String
    AllowedPattern: '[^@ ]+@[^@ ]+'
Conditions:
  IsProduction: !Equals [!Ref Environment, production]
Resources:
  EdgeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public CropCircle ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Web and REST ingress from the ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3001
          SourceSecurityGroupId: !Ref EdgeSecurityGroup
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL ingress from Fargate only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref TaskSecurityGroup
  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Redis ingress from Fargate only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref TaskSecurityGroup
  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: CropCircle database private subnets
      SubnetIds: !Ref PrivateSubnets
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: !Ref DbVersion
      DBName: cropcircle
      MasterUsername: cropcircle_admin
      ManageMasterUserPassword: true
      DBInstanceClass: !Ref DbClass
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: !If [IsProduction, true, false]
      DeletionProtection: !If [IsProduction, true, false]
      BackupRetentionPeriod: !If [IsProduction, 14, 3]
      CopyTagsToSnapshot: true
      EnableCloudwatchLogsExports: [postgresql, upgrade]
      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
  CacheSubnets:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: CropCircle cache private subnets
      SubnetIds: !Ref PrivateSubnets
  Cache:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: CropCircle Redis sessions and realtime jobs
      Engine: redis
      EngineVersion: '7.1'
      CacheNodeType: !Ref CacheClass
      CacheSubnetGroupName: !Ref CacheSubnets
      SecurityGroupIds: [!Ref CacheSecurityGroup]
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: true
      TransitEncryptionMode: required
      AuthToken: !Sub '{{resolve:secretsmanager:${ApplicationSecretArn}:SecretString:redis_token}}'
      NumCacheClusters: !If [IsProduction, 2, 1]
      AutomaticFailoverEnabled: !If [IsProduction, true, false]
      MultiAZEnabled: !If [IsProduction, true, false]
  Media:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  MediaPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Media
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Action: s3:*
            Principal: '*'
            Resource: [!GetAtt Media.Arn, !Sub '${Media.Arn}/*']
            Condition:
              Bool: {aws:SecureTransport: 'false'}
  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
  WebRepository:
    Type: AWS::ECR::Repository
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
  MlRepository:
    Type: AWS::ECR::Repository
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - {Name: containerInsights, Value: enabled}
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !If [IsProduction, 30, 7]
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal: {Service: ecs-tasks.amazonaws.com}
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy']
      Policies:
        - PolicyName: ReadCropCircleRuntimeSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref ApplicationSecretArn}
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal: {Service: ecs-tasks.amazonaws.com}
      Policies:
        - PolicyName: CropCircleMedia
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:GetObject', 's3:PutObject']
                Resource: !Sub '${Media.Arn}/*'
  Edge:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: !Ref PublicSubnets
      SecurityGroups: [!Ref EdgeSecurityGroup]
      LoadBalancerAttributes:
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
  WebTarget:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      HealthCheckPath: /api/health
  ApiTarget:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 3001
      HealthCheckPath: /api/v1/health/ready
  HTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Edge
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref WebTarget}]
  HTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Edge
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig: {Protocol: HTTPS, Port: '443', StatusCode: HTTP_301, Host: !Ref Domain}
  ApiRoute:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HTTPS
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values: ['/api/v1/*', '/realtime', '/realtime/*']
      Actions: [{Type: forward, TargetGroupArn: !Ref ApiTarget}]
  Alerts:
    Type: AWS::SNS::Topic
    Properties:
      Subscription: [{Protocol: email, Endpoint: !Ref AlertEmail}]
  ApiErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt Edge.LoadBalancerFullName}
        - {Name: TargetGroup, Value: !GetAtt ApiTarget.TargetGroupFullName}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]
  ApiUnhealthy:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt Edge.LoadBalancerFullName}
        - {Name: TargetGroup, Value: !GetAtt ApiTarget.TargetGroupFullName}
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref Alerts]
Outputs:
  Environment: {Value: !Ref Environment}
  Domain: {Value: !Ref Domain}
  EdgeDns: {Value: !GetAtt Edge.DNSName}
  DatabaseHost: {Value: !GetAtt Database.Endpoint.Address}
  DatabaseSecretArn: {Value: !GetAtt Database.MasterUserSecret.SecretArn}
  RedisHost: {Value: !GetAtt Cache.PrimaryEndPoint.Address}
  MediaBucket: {Value: !Ref Media}
  ApiRepository: {Value: !GetAtt ApiRepository.RepositoryUri}
  WebRepository: {Value: !GetAtt WebRepository.RepositoryUri}
  MlRepository: {Value: !GetAtt MlRepository.RepositoryUri}
  Cluster: {Value: !Ref Cluster}
  Logs: {Value: !Ref Logs}
  ExecutionRole: {Value: !GetAtt ExecutionRole.Arn}
  TaskRole: {Value: !GetAtt TaskRole.Arn}
  ApplicationSecret: {Value: !Ref ApplicationSecretArn}
  PrivateSubnetIds: {Value: !Join [',', !Ref PrivateSubnets]}
  TaskSecurityGroup: {Value: !Ref TaskSecurityGroup}
  WebTarget: {Value: !Ref WebTarget}
  ApiTarget: {Value: !Ref ApiTarget}
